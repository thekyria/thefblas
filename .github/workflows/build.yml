name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  analysis:
    # Static analysis (cppcheck, clang-tidy, Clang Static Analyzer) plus the
    # Makefile wrapper. Compiler and configuration coverage lives in `test`.
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install dependencies
      # libblas-dev: Netlib reference BLAS (with CBLAS) for test_reference_blas.
      run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy clang-tools libblas-dev

    - name: Run cppcheck
      # thefblas is header-only: there is no src/ directory.
      run: |
        cppcheck \
          --enable=warning,style,performance,portability \
          --std=c++17 \
          --language=c++ \
          --error-exitcode=1 \
          --inline-suppr \
          --suppress=missingIncludeSystem \
          -I include \
          include tests examples

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DTHEFBLAS_ENABLE_REFERENCE_TESTS=ON

    - name: Run clang-tidy
      # Header-only: analyse every translation unit (tests + examples), which
      # transitively covers all headers. File names are discovered dynamically
      # so the workflow tolerates added/removed test and example sources.
      run: |
        mapfile -t SOURCES < <(git ls-files 'tests/*.cpp' 'examples/*.cpp')
        clang-tidy -p ${{github.workspace}}/build "${SOURCES[@]}"

    - name: Build
      # scan-build wraps the compiler to run the Clang Static Analyzer and
      # emit an HTML report; the build artifacts land in build/ as normal.
      run: |
        scan-build -o ${{github.workspace}}/scan-results \
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Upload scan-build report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: scan-build-report
        path: ${{github.workspace}}/scan-results/
        if-no-files-found: ignore

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Build and test (wrapper for CMake)
      run: make test

  test:
    # Compiler x configuration matrix, with warnings treated as errors.
    name: test (${{ matrix.compiler.name }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.compiler.os }}
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc, os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { name: clang, os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { name: appleclang, os: macos-latest, cc: clang, cxx: clang++ }
        build_type: [ Debug, Release ]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DTHEFBLAS_WARNINGS_AS_ERRORS=ON
        -DTHEFBLAS_BUILD_BENCHMARKS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Test
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  msvc:
    # MSVC with the default Visual Studio generator, warnings as errors. MSVC
    # has no 128-bit integer, so 64-bit fixed point is compiled out as on
    # 32-bit ARM. msvc.yml only runs code analysis; this builds and runs tests.
    name: test (msvc, ${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Configure CMake
      run: cmake -B build -DTHEFBLAS_WARNINGS_AS_ERRORS=ON -DTHEFBLAS_BUILD_BENCHMARKS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Test
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer via THEFBLAS_ENABLE_SANITIZERS
    # (applied to Debug builds only, see CMakeLists.txt).
    name: sanitizers (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc, cc: gcc, cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      # UBSan only reports by default; make any finding fail the test.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Netlib reference BLAS
      run: sudo apt-get update && sudo apt-get install -y libblas-dev

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DTHEFBLAS_ENABLE_SANITIZERS=ON
        -DTHEFBLAS_WARNINGS_AS_ERRORS=ON
        -DTHEFBLAS_ENABLE_REFERENCE_TESTS=ON

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure

  arm-linux:
    # 32-bit ARM (armv7-a, hard float) Linux build. The compiler has no
    # __int128, so the 64-bit fixed-point paths use their fallbacks. The tests
    # run under qemu-user through CMAKE_CROSSCOMPILING_EMULATOR.
    name: arm-linux-gnueabihf (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install cross compiler and qemu
      run: sudo apt-get update && sudo apt-get install -y g++-arm-linux-gnueabihf qemu-user

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-linux-gnueabihf.cmake
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DTHEFBLAS_BUILD_TESTS=ON
        -DTHEFBLAS_BUILD_EXAMPLES=ON
        -DTHEFBLAS_WARNINGS_AS_ERRORS=ON
        "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf"

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure

  arm-none-eabi:
    # Bare-metal Cortex-M builds of every test and example, with warnings as
    # errors. They are linked against newlib's stubs (nosys.specs) to check that
    # everything compiles and links; running them would need firmware startup
    # code, so they are not executed.
    name: arm-none-eabi (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: cortex-m4, mcu: cortex-m4, float_abi: soft, fpu: "" }
          - { name: cortex-m4f, mcu: cortex-m4, float_abi: hard, fpu: fpv4-sp-d16 }
          - { name: cortex-m0, mcu: cortex-m0, float_abi: soft, fpu: "" }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install bare-metal toolchain
      run: >
        sudo apt-get update && sudo apt-get install -y
        gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi.cmake
        -DCMAKE_BUILD_TYPE=Release
        -DTHEFBLAS_ARM_MCU=${{ matrix.target.mcu }}
        -DTHEFBLAS_ARM_FLOAT_ABI=${{ matrix.target.float_abi }}
        -DTHEFBLAS_ARM_FPU=${{ matrix.target.fpu }}
        -DTHEFBLAS_BUILD_TESTS=ON
        -DTHEFBLAS_BUILD_EXAMPLES=ON
        -DTHEFBLAS_WARNINGS_AS_ERRORS=ON
        -DCMAKE_EXE_LINKER_FLAGS=--specs=nosys.specs

    - name: Build
      run: cmake --build build --parallel

    - name: Size report
      # embedded_q15 is linked with --gc-sections and uses no iostream, so its
      # size is the code it uses; fixed_point_ops is shown for comparison.
      run: |
        {
          echo "### Code size, ${{ matrix.target.name }}"
          echo '```'
          arm-none-eabi-size build/examples/thefblas_example_embedded_q15 \
            build/examples/thefblas_example_fixed_point_ops
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Install Doxygen
      run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Generate Doxygen docs
      run: doxygen Doxyfile

    - name: Upload Doxygen HTML
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: doxygen-html
        path: docs/doxygen/html
        if-no-files-found: error

    - name: Create documentation (wrapper for doxygen)
      run: make docs
