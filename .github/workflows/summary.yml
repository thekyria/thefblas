name: Summarize new issues

on:
  issues:
    types: [opened]

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create structured summary
        id: summarize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue
            const normalize = (text) =>
              String(text ?? "")
                .replace(/\r?\n+/g, " ")
                .replace(/\s+/g, " ")
                .trim()
            const truncate = (text, max) =>
              text.length > max ? `${text.slice(0, max - 1)}…` : text

            const title = truncate(normalize(issue.title), 120)
            const body = truncate(normalize(issue.body), 480)
            const summary = body
              ? `Automated summary:\n\n- Title: ${title}\n- Description: ${body}`
              : `Automated summary:\n\n- Title: ${title}\n- Description: _(no body provided)_`

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: summary,
            })
