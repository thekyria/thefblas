name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    # Only greet people from outside the repository: the action's own
    # first-time check also greeted the owner on every pull request.
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event_name == 'issues' && github.event.issue.author_association ||
      github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: >
          👋 Hey @${{ github.actor }}, thanks for opening your first issue!

          We appreciate you taking the time to report this. A maintainer will review it soon.
          Please make sure you've included all the relevant details (logs, steps to reproduce, etc.).
        pr_message: >
          🎉 Thanks for your first pull request, @${{ github.actor }}!
          A maintainer will review it shortly.
