name: Release

# Releases are prepared in a pull request: running
# `python3 scripts/prepare-release.py <VERSION>` bumps the version and moves
# the [Unreleased] changelog entries into a [VERSION] section. Once that is on
# main, this workflow tags the commit and creates the GitHub Release. It never
# pushes to main, whose rules require signed commits and code scanning results.

on:
  push:
    branches: ["main"]
    paths:
      - "CMakeLists.txt"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not extract version from CMakeLists.txt"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Release when the project version has no tag yet and the changelog has a
      # section for it. An existing tag means the version is already released.
      - name: Check whether this version needs a release
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists; nothing to release."
          elif ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md has no [${VERSION}] section; run scripts/prepare-release.py ${VERSION} in a pull request to release ${TAG}."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        if: steps.check.outputs.release == 'true'
        run: python3 scripts/extract-changelog.py "${{ steps.version.outputs.version }}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release
        if: steps.check.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "thefblas ${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --target "${GITHUB_SHA}"
          {
            echo "Released ${TAG}."
            echo
            echo "Next, update the vcpkg port in a pull request:"
            echo "\`python3 scripts/update-vcpkg-port.py ${{ steps.version.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
